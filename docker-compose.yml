version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soloshop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.soloshop.rule=Host(`www.soloshopbox.com`)"

      - "traefik.http.routers.soloshop.entrypoints=websecure"

      - "traefik.http.routers.soloshop.tls=true"

      - "traefik.http.routers.soloshop.tls.certresolver=letsencrypt"

      # App internal port

      - "traefik.http.services.soloshop.loadbalancer.server.port=3000"

    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/soloshop?schema=public"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      SESSION_SECRET: "${SESSION_SECRET:-dev-secret-change-in-production}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
      MYFATOORAH_API_KEY: "${MYFATOORAH_API_KEY}"
      MYFATOORAH_API_URL: "${MYFATOORAH_API_URL:-https://apitest.myfatoorah.com}"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "/usr/local/bin/prisma migrate deploy && node server.js"

volumes:
  postgres_data:
