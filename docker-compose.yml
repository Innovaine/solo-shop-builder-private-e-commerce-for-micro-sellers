version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soloshop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.single
    restart: always

    ports:
      - "3000:3000"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${HTTPS_APP_HOST_NAME}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=${HTTPS_APP_HOST_PORT}"

    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/soloshop?schema=public"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      SESSION_SECRET: "${SESSION_SECRET:-dev-secret-change-in-production}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
      MYFATOORAH_API_KEY: "${MYFATOORAH_API_KEY}"
      MYFATOORAH_API_URL: "${MYFATOORAH_API_URL:-https://apitest.myfatoorah.com}"
      S3_PROVIDER: "${S3_PROVIDER:-aws}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET}"
      AWS_CLOUDFRONT_URL: "${AWS_CLOUDFRONT_URL}"
      DO_SPACES_REGION: "${DO_SPACES_REGION}"
      DO_SPACES_ENDPOINT: "${DO_SPACES_ENDPOINT}"

    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node server.js"

volumes:
  postgres_data:
