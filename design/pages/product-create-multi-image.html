<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Product — Solo Shop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
      background: #F9FAFB;
      color: #1F2937;
    }
    header {
      background: white;
      border-bottom: 1px solid #E2E8F0;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #3B4C63;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1F2937;
    }

    /* Container */
    .container {
      max-width: 600px;
      margin: 24px auto;
      padding: 0 24px;
    }

    /* Form */
    .form-group {
      background: white;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid #E2E8F0;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1F2937;
      margin-bottom: 8px;
    }

    .form-help {
      font-size: 12px;
      color: #64748B;
      margin-top: 4px;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      margin-bottom: 16px;
    }

    .form-input:focus {
      outline: none;
      border-color: #3B4C63;
      box-shadow: 0 0 0 3px rgba(59, 76, 99, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* Image Upload Section */
    .image-upload-section {
      margin-bottom: 0;
    }

    .upload-area {
      border: 2px dashed #E2E8F0;
      border-radius: 8px;
      padding: 32px 24px;
      text-align: center;
      background: #FAF9F7;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 16px;
    }

    .upload-area:hover {
      border-color: #3B4C63;
      background: #F0F9FF;
    }

    .upload-area.active {
      border-color: #10B981;
      background: #F0FDF4;
    }

    .upload-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .upload-text {
      font-size: 14px;
      font-weight: 600;
      color: #1F2937;
      margin-bottom: 4px;
    }

    .upload-subtext {
      font-size: 12px;
      color: #64748B;
    }

    input[type="file"] {
      display: none;
    }

    /* Image Grid */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .image-thumbnail {
      position: relative;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      aspect-ratio: 1;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-preview {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #94A3B8;
    }

    .image-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      background: #10B981;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .image-badge.primary {
      background: #3B4C63;
    }

    .image-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #EF4444;
      color: white;
      border: none;
      border-radius: 3px;
      width: 20px;
      height: 20px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .image-thumbnail:hover .image-remove {
      opacity: 1;
    }

    .image-remove:hover {
      background: #DC2626;
    }

    /* Info Box */
    .info-box {
      background: #F0F9FF;
      border: 1px solid #BAE6FD;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      color: #0369A1;
      margin-bottom: 16px;
    }

    /* Button Group */
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .button {
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .button-primary {
      background: #10B981;
      color: white;
      flex: 1;
    }

    .button-primary:hover {
      background: #059669;
    }

    .button-secondary {
      background: white;
      color: #3B4C63;
      border: 1px solid #E2E8F0;
      flex: 1;
    }

    .button-secondary:hover {
      background: #FAF9F7;
      border-color: #3B4C63;
    }

    /* Mobile */
    @media (max-width: 640px) {
      .container {
        margin: 12px auto;
      }
      .image-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <header>
    <button class="back-button">←</button>
    <h1>Create Product</h1>
  </header>

  <div class="container">
    <form>
      <!-- Product Name -->
      <div class="form-group">
        <label class="form-label">Product Name *</label>
        <input type="text" class="form-input" placeholder="e.g., Gold Minimalist Necklace" required>
      </div>

      <!-- Price -->
      <div class="form-group">
        <label class="form-label">Price *</label>
        <input type="number" class="form-input" placeholder="45.00" step="0.01" min="0" required>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-input" placeholder="Describe your product in detail..."></textarea>
      </div>

      <!-- Category -->
      <div class="form-group">
        <label class="form-label">Category *</label>
        <select class="form-input" required>
          <option value="">Select a category</option>
          <option value="handmade">Handmade</option>
          <option value="vintage">Vintage</option>
          <option value="supplies">Supplies</option>
          <option value="other">Other</option>
        </select>
      </div>

      <!-- Multiple Images Upload -->
      <div class="form-group image-upload-section">
        <label class="form-label">Product Images (Max 5 images)</label>
        <div class="upload-area" onclick="document.getElementById('imageInput').click()">
          <div class="upload-icon">📷</div>
          <div class="upload-text">Click to upload or drag and drop</div>
          <div class="upload-subtext">PNG, JPG, GIF up to 10MB each</div>
          <input type="file" id="imageInput" multiple accept="image/*">
        </div>

        <div class="info-box">
          💡 First image uploaded will be the primary product image. You can reorder by removing and re-uploading.
        </div>

        <!-- Image Grid Preview -->
        <div class="image-grid">
          <div class="image-thumbnail">
            <div class="image-preview">+</div>
            <div class="image-badge primary">Primary</div>
          </div>
          <div class="image-thumbnail">
            <div class="image-preview">📸</div>
          </div>
          <div class="image-thumbnail">
            <div class="image-preview">📸</div>
          </div>
          <div class="image-thumbnail">
            <div class="image-preview">📸</div>
          </div>
          <div class="image-thumbnail">
            <div class="image-preview">📸</div>
          </div>
        </div>
      </div>

      <!-- Buttons -->
      <div class="button-group">
        <button type="button" class="button button-secondary">Cancel</button>
        <button type="submit" class="button button-primary">Create Product</button>
      </div>
    </form>
  </div>
</body>
</html>
