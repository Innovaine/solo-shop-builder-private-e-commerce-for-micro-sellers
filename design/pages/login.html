<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Solo Shop Builder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", sans-serif;
      background: linear-gradient(135deg, #3B4C63 0%, #2C3A4F 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
      max-width: 420px;
      width: 100%;
      padding: 48px 32px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #3B4C63;
      margin-bottom: 16px;
    }
    .auth-title {
      font-size: 28px;
      font-weight: 700;
      color: #1F2937;
      margin-bottom: 8px;
    }
    .auth-subtitle {
      font-size: 14px;
      color: #64748B;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #1F2937;
      margin-bottom: 8px;
    }
    input[type="email"],
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    input[type="email"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: #3B4C63;
      box-shadow: 0 0 0 3px rgba(59, 76, 99, 0.1);
    }
    input[type="email"]::placeholder,
    input[type="text"]::placeholder {
      color: #CBD5E1;
    }

    .submit-btn {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      background-color: #10B981;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }
    .submit-btn:hover {
      background-color: #059669;
      transform: translateY(-1px);
    }
    .submit-btn:active {
      transform: translateY(0);
    }

    /* Divider */
    .divider {
      text-align: center;
      margin: 32px 0;
      position: relative;
    }
    .divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background-color: #E2E8F0;
    }
    .divider span {
      background: white;
      padding: 0 8px;
      color: #64748B;
      font-size: 12px;
      position: relative;
      font-weight: 500;
    }

    /* Info Box */
    .info-box {
      background: #FAF9F7;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #64748B;
      line-height: 1.6;
    }
    .info-box strong {
      color: #3B4C63;
    }

    /* Footer */
    .auth-footer {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #E2E8F0;
      font-size: 14px;
    }
    .auth-footer p {
      color: #64748B;
      margin-bottom: 8px;
    }
    .auth-footer a {
      color: #3B4C63;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }

    /* State: After Submit */
    .success-state {
      display: none;
      text-align: center;
    }
    .success-state.show {
      display: block;
    }
    .form-group.hide {
      display: none;
    }
    .submit-btn.hide {
      display: none;
    }
    .success-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .success-message {
      font-size: 16px;
      color: #1F2937;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .success-detail {
      font-size: 14px;
      color: #64748B;
      line-height: 1.6;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .auth-container {
        padding: 32px 24px;
      }
      .auth-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo">Solo Shop</div>
      <h1 class="auth-title">Sign In</h1>
      <p class="auth-subtitle">or create a new account</p>
    </div>

    <form id="loginForm">
      <div class="info-box">
        <strong>No password needed.</strong> We'll send you a login link via email.
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
          autocomplete="email"
        />
      </div>

      <button type="submit" class="submit-btn">Send Login Link</button>

      <div class="divider">
        <span>already have a shop?</span>
      </div>

      <div class="success-state" id="successState">
        <div class="success-icon">✓</div>
        <div class="success-message">Check your email</div>
        <div class="success-detail">
          We've sent a login link to <strong id="emailDisplay"></strong>.<br/>
          Click the link to sign in or create your shop.
        </div>
      </div>
    </form>

    <div class="auth-footer">
      <p>New to Solo Shop? <a href="/">Learn more</a></p>
    </div>
  </div>

  <script>
    // This is a design reference — the form submission will be wired by the engineer.
    // The success state shows what the user sees after submitting their email.
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      document.getElementById('emailDisplay').textContent = email;
      
      // Hide form, show success
      document.querySelectorAll('.form-group').forEach(el => el.classList.add('hide'));
      document.querySelector('.submit-btn').classList.add('hide');
      document.getElementById('successState').classList.add('show');
    });
  </script>
</body>
</html>
