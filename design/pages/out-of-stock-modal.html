<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Out of Stock — Solo Shop Builder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif; background: rgba(0, 0, 0, 0.5); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.3); display: none; z-index: 100; }
    .modal-overlay.show { display: block; }
    
    .modal { background: white; border-radius: 8px; padding: 40px 32px; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2); position: relative; z-index: 101; }
    
    .modal-icon { font-size: 48px; text-align: center; margin-bottom: 20px; }
    
    .modal-title { font-size: 20px; font-weight: 700; color: #1F2937; text-align: center; margin-bottom: 12px; }
    
    .modal-description { font-size: 14px; color: #64748B; text-align: center; line-height: 1.6; margin-bottom: 24px; }
    
    .product-info { background: #F9FAFB; border: 1px solid #E2E8F0; border-radius: 6px; padding: 16px; margin-bottom: 24px; }
    .product-info-title { font-weight: 600; color: #1F2937; margin-bottom: 4px; }
    .product-info-detail { font-size: 12px; color: #64748B; }
    
    .notify-section { background: #F0FDF4; border: 1px solid #BBDF37; border-radius: 6px; padding: 16px; margin-bottom: 24px; }
    .notify-title { font-size: 13px; font-weight: 600; color: #15803D; margin-bottom: 12px; }
    .notify-form { display: flex; gap: 8px; }
    .notify-form input { flex: 1; padding: 10px 12px; font-size: 13px; border: 1px solid #BBDF37; border-radius: 6px; font-family: inherit; }
    .notify-form input::placeholder { color: #86EFAC; }
    .notify-form button { flex: 0 0 auto; padding: 10px 16px; background: #10B981; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .notify-form button:hover { background: #059669; }
    
    .modal-buttons { display: flex; flex-direction: column; gap: 12px; }
    button { border: none; padding: 12px 24px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .btn-primary { background: #10B981; color: white; }
    .btn-primary:hover { background: #059669; }
    .btn-secondary { background: white; color: #3B4C63; border: 1px solid #E2E8F0; }
    .btn-secondary:hover { background: #F9FAFB; }
    
    .modal-note { font-size: 12px; color: #94A3B8; text-align: center; margin-top: 16px; }
    
    /* Variant: Stock Low (not out) */
    .modal.stock-low { }
    .modal.stock-low .modal-icon { font-size: 40px; }
    .modal.stock-low .modal-title { color: #F59E0B; }
    .modal.stock-low .notify-section { background: #FFFBEB; border-color: #FCD34D; }
    .modal.stock-low .notify-title { color: #92400E; }
    
    @media (max-width: 480px) {
      .modal { padding: 32px 24px; }
      .notify-form { flex-direction: column; }
      .notify-form button { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- EXAMPLE 1: Out of Stock -->
  <div class="modal">
    <div class="modal-icon">😞</div>
    <h2 class="modal-title">Out of Stock</h2>
    <p class="modal-description">This item is currently unavailable. Join the waitlist below to be notified when it's back in stock.</p>
    
    <div class="product-info">
      <div class="product-info-title">Hand-thrown Ceramic Bowl (Large)</div>
      <div class="product-info-detail">Size: Large, Color: Blue</div>
    </div>
    
    <div class="notify-section">
      <div class="notify-title">Notify Me When Available</div>
      <div class="notify-form">
        <input type="email" placeholder="your@email.com" required>
        <button>Notify</button>
      </div>
    </div>
    
    <div class="modal-buttons">
      <button class="btn-secondary" onclick="history.back()">← Back to Shop</button>
      <button class="btn-primary">Browse Similar Items</button>
    </div>
    
    <p class="modal-note">We'll email you as soon as this becomes available — no spam, ever.</p>
  </div>
