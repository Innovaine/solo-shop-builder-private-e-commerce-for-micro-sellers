<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products — Solo Shop Builder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", sans-serif;
      background-color: #FAF9F7;
      color: #1F2937;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1F2937;
    }

    .page-actions {
      display: flex;
      gap: 12px;
    }

    .btn-primary {
      background-color: #10B981;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #059669;
    }

    .search-bar {
      margin-bottom: 24px;
    }

    .search-bar input {
      width: 100%;
      max-width: 300px;
      padding: 12px 16px;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    .search-bar input:focus {
      outline: none;
      border-color: #3B4C63;
      box-shadow: 0 0 0 3px rgba(59, 76, 99, 0.1);
    }

    /* Product Table */
    .products-table {
      background: white;
      border-radius: 8px;
      border: 1px solid #E2E8F0;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #F9FAFB;
      border-bottom: 1px solid #E5E7EB;
    }

    th {
      padding: 16px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      color: #1F2937;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid #F3F4F6;
      font-size: 14px;
    }

    tr:hover {
      background: #F9FAFB;
    }

    .product-name {
      font-weight: 600;
      color: #3B4C63;
    }

    .product-price {
      color: #10B981;
      font-weight: 600;
    }

    .product-stock {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .stock-in {
      background: #D1FAE5;
      color: #065F46;
    }

    .stock-low {
      background: #FEF3C7;
      color: #92400E;
    }

    .stock-out {
      background: #FEE2E2;
      color: #991B1B;
    }

    .product-image {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      background: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      padding: 8px 12px;
      border: 1px solid #E2E8F0;
      background: white;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      color: #3B4C63;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      background: #F9FAFB;
      border-color: #3B4C63;
    }

    .btn-delete {
      color: #F43F5E;
      border-color: #FECDD3;
    }

    .btn-delete:hover {
      background: #FEE2E2;
    }

    .empty-state {
      text-align: center;
      padding: 64px 32px;
      background: white;
      border-radius: 8px;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-title {
      font-size: 20px;
      font-weight: 600;
      color: #1F2937;
      margin-bottom: 8px;
    }

    .empty-text {
      color: #64748B;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .pagination {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .pagination-btn {
      padding: 8px 12px;
      border: 1px solid #E2E8F0;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      color: #3B4C63;
      font-weight: 600;
    }

    .pagination-btn.active {
      background: #3B4C63;
      color: white;
      border-color: #3B4C63;
    }

    @media (max-width: 768px) {
      .container {
        padding: 16px;
      }

      .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .page-actions {
        flex-direction: column;
        width: 100%;
      }

      .btn-primary {
        width: 100%;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 12px 8px;
      }

      .actions {
        flex-direction: column;
      }

      .btn-icon {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>Manage Products</h1>
      <div class="page-actions">
        <a href="#" id="exportCsvBtn" style="display: inline-block; padding: 12px 24px; background: white; color: #3B4C63; border: 1px solid #E2E8F0; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; transition: all 0.2s ease;" onmouseover="this.style.backgroundColor='#FAF9F7'; this.style.borderColor='#3B4C63';" onmouseout="this.style.backgroundColor='white'; this.style.borderColor='#E2E8F0';">📥 Export CSV</a>
        <button class="btn-primary">+ Add Product</button>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" placeholder="Search products..." />
    </div>

    <!-- With Products -->
    <div class="products-table">
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <div style="display: flex; align-items: center; gap: 12px;">
                <div class="product-image">📦</div>
                <div class="product-name">Handmade Ceramic Mug</div>
              </div>
            </td>
            <td>Handmade</td>
            <td class="product-price">$24.99</td>
            <td>
              <span class="product-stock stock-in">12 in stock</span>
            </td>
            <td>
              <div class="actions">
                <button class="btn-icon">Edit</button>
                <button class="btn-icon btn-delete">Delete</button>
              </div>
            </td>
          </tr>
          <tr>
            <td>
              <div style="display: flex; align-items: center; gap: 12px;">
                <div class="product-image">🪡</div>
                <div class="product-name">Vintage Leather Wallet</div>
              </div>
            </td>
            <td>Vintage</td>
            <td class="product-price">$45.00</td>
            <td>
              <span class="product-stock stock-low">3 in stock</span>
            </td>
            <td>
              <div class="actions">
                <button class="btn-icon">Edit</button>
                <button class="btn-icon btn-delete">Delete</button>
              </div>
            </td>
          </tr>
          <tr>
            <td>
              <div style="display: flex; align-items: center; gap: 12px;">
                <div class="product-image">🧵</div>
                <div class="product-name">Craft Supplies Bundle</div>
              </div>
            </td>
            <td>Supplies</td>
            <td class="product-price">$12.50</td>
            <td>
              <span class="product-stock stock-out">Out of stock</span>
            </td>
            <td>
              <div class="actions">
                <button class="btn-icon">Edit</button>
                <button class="btn-icon btn-delete">Delete</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <button class="pagination-btn active">1</button>
      <button class="pagination-btn">2</button>
      <button class="pagination-btn">3</button>
    </div>

    <!-- Empty State (Commented) -->
    <!--
    <div class="empty-state">
      <div class="empty-icon">📦</div>
      <div class="empty-title">No products yet</div>
      <div class="empty-text">Start building your shop by adding your first product.</div>
      <button class="btn-primary">Add Your First Product</button>
    </div>
    -->
  </div>
</body>
</html>
